<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="style.css">

<style>
body { background: #f8dfe4; }

.container {
  position: relative;
  width: 100%;
  max-width: 450px;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: 50px 20px 40px;
}

.title {
  margin: 0;
  font-family: cursive;
  font-size: clamp(32px, 9vw, 42px);
  color: #3c2929;
}

.name {
  margin-top: 5px;
  font-family: Arial, sans-serif;
  font-size: clamp(30px, 9vw, 40px);
  font-weight: bold;
  letter-spacing: 2px;
  color: #d41462;
}

/* ---------- bunting ---------- */
.decorations {
  position: relative;
  height: 55px;
  margin-top: 30px;
}

.string {
  position: absolute;
  left: 5%;
  top: 20px;
  width: 90%;
  height: 3px;
  background: #49312d;
  transform: rotate(-2deg);
}

.flag {
  position: absolute;
  top: 21px;
  width: 0;
  height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 28px solid #f05c82;
}
.f1 { left: 8%;  border-top-color: #f05c82; }
.f2 { left: 25%; border-top-color: #72d66b; }
.f3 { left: 42%; border-top-color: #ffd45c; }
.f4 { left: 59%; border-top-color: #61d5c5; }
.f5 { left: 76%; border-top-color: #f05c82; }
.f6 { left: 89%; border-top-color: #8edc69; }

/* ---------- characters ---------- */
.characters {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 3px;
  height: 330px;
  margin-top: 5px;
}

.bear,
.bunny {
  position: relative;
  width: 155px;
  height: 225px;
  border: 4px solid #4a302b;
  border-radius: 75px 75px 60px 60px;
}

.bear  { background: #c9925b; z-index: 2; }
.bunny { background: #eaf5ee; z-index: 1; }

.bear-ear {
  position: absolute;
  top: -15px;
  width: 48px;
  height: 48px;
  background: #c9925b;
  border: 4px solid #4a302b;
  border-radius: 50%;
}
.bear-ear.ear1 { left: 5px; }
.bear-ear.ear2 { right: 5px; }

.bunny-ear {
  position: absolute;
  top: -67px;
  width: 43px;
  height: 82px;
  background: #eaf5ee;
  border: 4px solid #4a302b;
  border-radius: 50%;
}
.bunny-ear.ear1 { left: 35px;  transform: rotate(-10deg); }
.bunny-ear.ear2 { right: 35px; transform: rotate(10deg); }

.eye {
  position: absolute;
  top: 82px;
  width: 13px;
  height: 18px;
  background: #30201e;
  border-radius: 50%;
}
.eye1 { left: 43px; }
.eye2 { right: 43px; }

.mouth {
  position: absolute;
  top: 103px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 25px;
  color: #30201e;
}

.cheek {
  position: absolute;
  top: 112px;
  width: 32px;
  height: 24px;
  border-radius: 50%;
}
.cheek1 { left: 12px; }
.cheek2 { right: 12px; }
.bear  .cheek { background: #f4c85d; }
.bunny .cheek { background: #efb7aa; }

/* ---------- cake held by the bear ---------- */
.cake {
  position: absolute;
  left: 75px;
  bottom: 18px;
  width: 165px;
  z-index: 5;
}

.flame {
  position: absolute;
  left: 50%;
  top: -75px;
  transform: translateX(-50%);
  font-size: 23px;
}

.candle {
  position: absolute;
  left: 50%;
  top: -42px;
  width: 12px;
  height: 45px;
  background: #b9eee0;
  border: 2px solid #555;
  transform: translateX(-50%);
}

.cake-top {
  width: 135px;
  height: 38px;
  margin: auto;
  background: #fff;
  border: 3px solid #563b35;
  border-radius: 50%;
}

.cake-body {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 150px;
  height: 65px;
  margin: -5px auto 0;
  background: #f29ca5;
  border: 3px solid #563b35;
  border-radius: 8px 8px 25px 25px;
  color: #a52b57;
  font-family: Arial, sans-serif;
  font-size: 17px;
  font-weight: bold;
  line-height: 21px;
}

/* ---------- floating emoji ---------- */
.floaters {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.floaters span {
  position: absolute;
  font-size: 28px;
  animation: float 3s ease-in-out infinite;
}
.fl1 { top: 440px; left: 22px; }
.fl2 { top: 465px; right: 22px; animation-delay: 0.4s; }
.fl3 { top: 225px; left: 28px; animation-delay: 0.8s; }
.fl4 { top: 235px; right: 28px; animation-delay: 1.2s; }
.fl5 { top: 530px; left: 50%; animation-delay: 0.6s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

/* ---------- question + buttons ---------- */
.question {
  position: relative;
  margin-top: 45px;
  font-size: clamp(21px, 6vw, 25px);
  font-weight: bold;
  line-height: 1.3;
  color: #302525;
}

.buttons {
  position: relative;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 28px;
}

.choice {
  width: 140px;
  height: 62px;
  border-radius: 18px;
  font-size: 21px;
  transition: transform 0.3s;
}
.choice:hover { transform: scale(1.06); }

.yes {
  background: #e00072;
  color: #fff;
  box-shadow: 0 5px 15px rgba(150, 50, 90, 0.25);
}

.no {
  background: #fffafa;
  color: #333;
  box-shadow: 0 5px 15px rgba(150, 50, 90, 0.2);
}

#message {
  position: relative;
  min-height: 30px;
  margin-top: 25px;
  font-size: 21px;
  font-weight: bold;
  color: #d41462;
}

@media (max-width: 400px) {
  .characters { transform: scale(0.88); transform-origin: top center; margin-top: -5px; }
}
</style>
</head>

<body>
<div class="container">

  <h1 class="title">Happy Birthday,</h1>
  <div class="name">NAVI KUTTY</div>

  <div class="decorations">
    <div class="string"></div>
    <div class="flag f1"></div>
    <div class="flag f2"></div>
    <div class="flag f3"></div>
    <div class="flag f4"></div>
    <div class="flag f5"></div>
    <div class="flag f6"></div>
  </div>

  <div class="characters">

    <div class="bear">
      <div class="bear-ear ear1"></div>
      <div class="bear-ear ear2"></div>
      <div class="eye eye1"></div>
      <div class="eye eye2"></div>
      <div class="mouth">ʊ</div>
      <div class="cheek cheek1"></div>
      <div class="cheek cheek2"></div>

      <div class="cake">
        <div class="flame">🔥</div>
        <div class="candle"></div>
        <div class="cake-top"></div>
        <div class="cake-body">HAPPY<br>BIRTHDAY</div>
      </div>
    </div>

    <div class="bunny">
      <div class="bunny-ear ear1"></div>
      <div class="bunny-ear ear2"></div>
      <div class="eye eye1"></div>
      <div class="eye eye2"></div>
      <div class="mouth">ʊ</div>
      <div class="cheek cheek1"></div>
      <div class="cheek cheek2"></div>
    </div>

  </div>

  <div class="floaters" aria-hidden="true">
    <span class="fl1">⭐</span>
    <span class="fl2">⭐</span>
    <span class="fl3">🌸</span>
    <span class="fl4">🌼</span>
    <span class="fl5">💗</span>
  </div>

  <div class="question">Are you excited for what's next?</div>

  <div class="buttons">
    <button class="choice yes" onclick="location.href='navi2.html'">Yes</button>
    <button class="choice no" onclick="noClicked()">No</button>
  </div>

  <div id="message"></div>

</div>

<script>
  function noClicked() {
    document.getElementById("message").textContent =
      "🥺 Are you sure? Try again! 💕";
  }
</script>
</body>
</html>
